<div class="row">
  <div class="col-md-8 offset-md-2">
    <h2>Edit Trip</h2>
    <p *ngIf="message" class="alert alert-danger">{{ message }}</p>
    <form [formGroup]="editForm" (ngSubmit)="onSubmit()">

      <div class="mb-3">
        <label for="code" class="form-label">Trip Code</label>
        <input type="text" id="code" formControlName="code" class="form-control"
          [ngClass]="{'is-invalid': submitted && f['code'].errors}">
        <div *ngIf="submitted && f['code'].errors" class="invalid-feedback">Trip code is required.</div>
      </div>

      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" id="name" formControlName="name" class="form-control"
          [ngClass]="{'is-invalid': submitted && f['name'].errors}">
        <div *ngIf="submitted && f['name'].errors" class="invalid-feedback">Name is required.</div>
      </div>

      <div class="mb-3">
        <label for="length" class="form-label">Length</label>
        <input type="text" id="length" formControlName="length" class="form-control"
          [ngClass]="{'is-invalid': submitted && f['length'].errors}">
        <div *ngIf="submitted && f['length'].errors" class="invalid-feedback">Length is required.</div>
      </div>

      <div class="mb-3">
        <label for="start" class="form-label">Start Date (YYYY-MM-DD)</label>
        <input type="text" id="start" formControlName="start" class="form-control"
          [ngClass]="{'is-invalid': submitted && f['start'].errors}">
        <div *ngIf="submitted && f['start'].errors" class="invalid-feedback">Start date is required.</div>
      </div>

      <div class="mb-3">
        <label for="resort" class="form-label">Resort</label>
        <input type="text" id="resort" formControlName="resort" class="form-control"
          [ngClass]="{'is-invalid': submitted && f['resort'].errors}">
        <div *ngIf="submitted && f['resort'].errors" class="invalid-feedback">Resort is required.</div>
      </div>

      <div class="mb-3">
        <label for="perPerson" class="form-label">Per Person ($)</label>
        <input type="text" id="perPerson" formControlName="perPerson" class="form-control"
          [ngClass]="{'is-invalid': submitted && f['perPerson'].errors}">
        <div *ngIf="submitted && f['perPerson'].errors" class="invalid-feedback">Per person price is required.</div>
      </div>

      <div class="mb-3">
        <label for="image" class="form-label">Image URL</label>
        <input type="text" id="image" formControlName="image" class="form-control"
          [ngClass]="{'is-invalid': submitted && f['image'].errors}">
        <div *ngIf="submitted && f['image'].errors" class="invalid-feedback">Image URL is required.</div>
      </div>

      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea id="description" formControlName="description" class="form-control" rows="4"
          [ngClass]="{'is-invalid': submitted && f['description'].errors}"></textarea>
        <div *ngIf="submitted && f['description'].errors" class="invalid-feedback">Description is required.</div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Update Trip</button>
        <a routerLink="/" class="btn btn-secondary">Cancel</a>
      </div>

    </form>
  </div>
</div>
